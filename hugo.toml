# Cibergüenzas: el muro de la vergüenza de la ciberseguridad.
# baseURL solo importa en local: el workflow de GitHub Pages lo sobreescribe al desplegar.
baseURL                = "https://ciberguenzas.github.io/"
title                  = "Cibergüenzas"
languageCode           = "es-es"
defaultContentLanguage = "es"
theme                  = "hugo-theme-windowsxp"

enableEmoji          = true
enableRobotsTXT      = true
capitalizeListTitles = false   # las tags salen tal cual se escriben (HTB, tshark, mod_dumpio)

[pagination]
  pagerSize = 10

[markup]
  [markup.goldmark.renderer]
    unsafe = true            # HTML dentro de los posts (details, kbd, comentarios TODO...)
  [markup.highlight]
    style = "monokai"
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3

[taxonomies]
  category = "categorias"
  tag      = "tags"
  series   = "series"

[languages]
  [languages.es]
    languageName = "Español"
    weight       = 1

[params]
  name        = "deadlock"
  bio         = "El muro de la vergüenza de la ciberseguridad"
  description = "Cibergüenzas: fallos de seguridad reales, ridículos y evitables, contados con humor y con la lección técnica detrás."
  avatar      = "favicon.svg"
  favicon     = "favicon.svg"
  github      = "Deadlock-101"

  # Secciones cuyos posts salen como ficheros sueltos en el escritorio y en «Últimas cibergüenzas»
  mainSections = ["posts"]

  # Ventana que se abre al entrar: la lista de posts, para que lo primero que vea
  # el lector sea un listado normal y no tenga que adivinar nada.
  [params.xp]
    homeWindow      = "/posts/"
    homeWindowTitle = "Posts"
    homeWindowIcon  = "MyDocuments"

# Cada entrada del menú es un icono del escritorio, una entrada del menú Inicio y un
# enlace en «Otros sitios». El identifier tiene que coincidir con la sección.
# Sin params.icon: el tema pone sus iconos de serie según el identifier
# (posts: Mis documentos; cualquier otro: carpeta amarilla).
[menu]
  [[menu.main]]
    identifier = "posts"
    name       = "Posts"
    url        = "/posts/"
    weight     = 10
  [[menu.main]]
    identifier = "tags"
    name       = "Tags"
    url        = "/tags/"
    weight     = 20
