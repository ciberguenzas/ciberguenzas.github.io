# Cibergüenzas: el muro de la vergüenza de la ciberseguridad.
# baseURL solo importa en local: el workflow de GitHub Pages lo sobreescribe al desplegar.
baseURL      = "https://ciberguenzas.github.io/"
title        = "Cibergüenzas"
languageCode = "es-es"
theme        = "hello-friend-ng"

enableEmoji     = true
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[markup]
  [markup.goldmark.renderer]
    unsafe = true            # HTML dentro de los posts (details, kbd, comentarios TODO...)
  [markup.highlight]
    style = "monokai"
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3

[taxonomies]
  category = "categorias"
  tag      = "tags"
  series   = "series"

[params]
  dateform        = "2 Jan 2006"
  dateformShort   = "2 Jan"
  dateformNum     = "2006-01-02"
  dateformNumTime = "2006-01-02 15:04"

  homeSubtitle = "El muro de la vergüenza de la ciberseguridad. Fallos reales, ridículos y evitables, con la lección detrás de cada uno."
  description  = "Cibergüenzas: fallos de seguridad reales, ridículos y evitables, contados con humor y con la lección técnica detrás."
  keywords     = "ciberseguridad, fallos de seguridad, brechas, contraseñas, humor, lecciones, deadlock"
  images       = [""]

  disableReadOtherPosts    = false
  enableThemeToggle        = true
  enableSharingButtons     = true
  enableReadingTime        = true
  enableGlobalLanguageMenu = false

  [params.author]
    name = "deadlock"

  [params.logo]
    logoMark        = "$"
    logoText        = "tail -f verguenzas.log"
    logoHomeLink    = "/"
    logoCursorColor = "#FF5E5B"

  # Lo lee layouts/partials/favicons.html (override propio, solo favicon.svg)
  [params.favicon]
    theme         = "#1b1c1d"
    msapplication = "#1b1c1d"

  [params.footer]
    trademark = 2026
    rss       = true
    copyright = true
    author    = true
    topText   = []
    bottomText = [
      "Hecho con <a href=\"https://gohugo.io\">Hugo</a> y una cantidad razonable de vergüenza ajena"
    ]

[[params.social]]
  name = "github"
  url  = "https://github.com/Deadlock-101"

[languages]
  [languages.es]
    title     = "Cibergüenzas"
    copyright = "2026 deadlock"
  [languages.es.params]
    subtitle       = "El muro de la vergüenza de la ciberseguridad"
    readOtherPosts = "Más cibergüenzas"

# El tema ordena el menú por identifier, de ahí el prefijo numérico
[menu]
  [[menu.main]]
    identifier = "1-posts"
    name       = "Cibergüenzas"
    url        = "posts/"
  [[menu.main]]
    identifier = "2-tags"
    name       = "Tags"
    url        = "tags/"
  [[menu.main]]
    identifier = "3-about"
    name       = "man ciberguenzas"
    url        = "about/"
